version: '3.8'
services:
  metaforge:
    image: python:3.10-slim
    container_name: metaforge
    working_dir: /app
    volumes:
      - ./metaforge:/app
    ports:
      - "8000:8000"
    command: >
      sh -c "pip install -r requirements.txt &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    restart: unless-stopped

  n8n:
    image: n8nio/n8n
    container_name: n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      - GENERIC_TIMEZONE=Europe/Paris
    restart: unless-stopped

  guardian:
    image: python:3.10-slim
    container_name: metaguardian
    working_dir: /app
    volumes:
      - ./guardian:/app
    ports:
      - "8686:8686"
    command: >
      sh -c "pip install -r requirements.txt &&
             uvicorn main:app --host 0.0.0.0 --port 8686 --reload"
    restart: unless-stopped
volumes:
  n8n_data:
